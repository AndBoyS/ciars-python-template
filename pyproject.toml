[project]
name = "ciars-python-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AndBoyS", email = "andboyxd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    "E501",  # Line too long
]

[tool.mypy]
strict = true
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_unused_ignores = true
allow_redefinition = true
no_implicit_reexport = false

# Recommended way to ignore untyped packages
# (since sometimes you can install types for these separately, like pandas-stubs)
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
]
ignore_missing_imports = true

# VSCode Pylance settings are usually ignored in favor of this
[tool.pyright]
reportRedeclaration = false
typeCheckingMode = "off"

[dependency-groups]
dev = [
    "mypy==1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]
